name: 功能建议
description: 提议新的产品能力或行为
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不是只描述按钮或页面。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 数据、兼容或隐私约束
