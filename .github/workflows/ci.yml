name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check:secrets
      - run: npm run test:unit
      - run: npm run test:ai-eval
      - name: Preserve offline AI ledger eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ai-eval/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/e2e/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Preserve synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/tests/**/*.png
            .tmp/tests/e2e/upgrade-cache/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest
        working-directory: app/android

      # Private diagnostic artifact only. Signing stays on the user's authorized build host.
      - name: Assemble unsigned diagnostic candidate
        run: ./gradlew assembleRelease -PgleamUnsignedTestApk=true
        working-directory: app/android
      - name: Require exactly one unsigned diagnostic APK
        run: |
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*-unsigned.apk)
          test "${#apks[@]}" -eq 1
          test -s "${apks[0]}"
      - name: Preserve unsigned diagnostic candidate and exact web resources
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-diagnostic-${{ github.sha }}
          path: |
            app/android/app/build/outputs/apk/release/*-unsigned.apk
            app/dist/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
