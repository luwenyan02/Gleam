name: Preview checks

on:
  push:
    branches: [preview/orbstack]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history_secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch all branch, tag and pull request history
        run: |
          if ! git fetch --quiet --no-tags --no-recurse-submodules origin \
            'refs/heads/*:refs/audit/heads/*' \
            'refs/tags/*:refs/audit/tags/*' \
            'refs/pull/*/head:refs/audit/pulls/*' >/dev/null 2>&1; then
            echo '::error::Unable to fetch complete repository history'
            exit 1
          fi
      - name: Scan complete Git history for secrets
        run: python3 scripts/check-history-secrets.py
      - name: Verify history scanner regression guards
        run: python3 scripts/test-history-secrets.py

  preview:
    needs: history_secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python3 scripts/test-preview-sync.py
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run check:secrets
        working-directory: app
      - run: npm run test:unit
        working-directory: app
      - run: npm run build
        working-directory: app

  android:
    needs: history_secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest assembleRelease -PgleamUnsignedTestApk=true
        working-directory: app/android
