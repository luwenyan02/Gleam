<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#D66A2C">
  <!-- [M3] iOS PWA 收尾：主屏幕全屏与状态栏风格 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拾光">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- 深色模式防闪白：同步读 localStorage 镜像（core/theme.ts 维护），先于样式加载设 data-theme -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('gleam-theme');
        if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* 隐私模式等读取失败时保持浅色 */ }
    })();
  </script>
  <title>拾光 · 记账与生活记录</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
